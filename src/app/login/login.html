<body>
    @if(currentStep === 'login'){
    <div class="login">
        <div class="logoimage">
            <img src="assets/logo.jfif" alt="">
        </div>
        <div class="brand">
            <h2>MOSTEDGE</h2>
            <p>Protect Every Penny, Power every possibility</p>
        </div>
        <div class="input-container">
            <input 
            id="username"
            type="text" placeholder="username" 
            id="username" [(ngModel)]="username" 
            required>
            <input id="password"
            type="password" 
            placeholder="password" 
            required>
            <div class="botton"> 
                <button class="submit" type="submit">LOG IN</button>
            </div>
           @if(errorMessage){
                 
            <span>{{ errorMessage }}</span>
           }

         
            <div class="create-account">
                <div class="forgot-password">
                    <a href="#">Forgot password</a>
                </div>
                <div class="signup">
                    Don't Have An Account? <a href="#" (click)="currentStep = 'signup'; $event.preventDefault()">  Sign Up
                    </a>
                </div>
            </div>
        </div>
    </div>
    }
    @if(currentStep === 'signup'){
    <div class="form-container">
        <div class="form-header">
            <h3>Sign Up</h3>
        </div>
        <div class="input-container">
            <input
             type="text" 
             placeholder="Username" 
             required >
            <input 
            type="email" 
            placeholder="Email Address" 
            required>
            <input
             type="password" 
             placeholder="Creat Password" 
             required>
            <input 
            type="password" placeholder="Re-Enter password" 
            required>
            <div class="botton">
                <button class="submit" type="submit">
                    SIGN UP
                </button>
            </div>
            <div class="signup">
                Already Have An Account<a (click)="currentStep = 'login'; $event.preventDefault()"> Log In </a>
            </div>
        </div>
    </div>
    }
</body>
