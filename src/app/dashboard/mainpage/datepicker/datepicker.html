<div class="date-filter-controls">
  <div class="quick-ranges" aria-label="Quick purchase date ranges">
    @for (range of quickRanges; track range.days) {
      <button
        type="button"
        class="btn btn-secondary btn-block"
        [class.is-selected]="selectedPresetDays() === range.days"
        [attr.aria-pressed]="selectedPresetDays() === range.days"
        (click)="selectQuickRange(range.days)">
        {{ range.label }}
      </button>
    }
  </div>

  <mat-form-field appearance="outline" class="date-range-field" subscriptSizing="dynamic">
    <mat-date-range-input [rangePicker]="picker" aria-label="Select purchase date range">
      <input
        matStartDate
        [ngModel]="startDate()"
        (ngModelChange)="startDate.set($event)"
        (dateChange)="onDateChange()"
        (click)="picker.open()"
        placeholder="Start Date">

      <input
        matEndDate
        [ngModel]="endDate()"
        (ngModelChange)="endDate.set($event)"
        (dateChange)="onDateChange()"
        (click)="picker.open()"
        placeholder="End Date">
    </mat-date-range-input>

    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-date-range-picker #picker></mat-date-range-picker>
  </mat-form-field>
</div>
