<mat-tab-group>
  <mat-tab label="All"> </mat-tab>
  <mat-tab label="Pending"> </mat-tab>
  <mat-tab label="Deliveries"> </mat-tab>
  <mat-tab label="Invoices"> </mat-tab>
  <mat-tab label="Partially Completed"> </mat-tab>
  <mat-tab label="Completed"> </mat-tab>
  <mat-tab label="Re-Scan"> </mat-tab>
  <mat-tab label="Ineligible"> </mat-tab>
</mat-tab-group>
<div class="divider-container">

  <div class="col-md-2">
    <h4>{{ title }}</h4>
  </div>

  <div class="d-flex align-items-center" style="margin-right: 5%;">
    <input type="checkbox" id="possibleDuplicates" class="form-check-input me-2" />
    <label for="possibleDuplicates">
      Possible Duplicates
    </label>
  </div>

  <div class="d-flex align-items-center" style="margin-right: 5%;">
    <span class="me-2">Complexity:</span>

    <mat-form-field appearance="outline">
      <mat-label>Complexity</mat-label>

      <mat-select>
        @for (complexity of complexities; track complexity.value) {
        <mat-option [value]="complexity.value">
          {{ complexity.viewValue }}
        </mat-option>
        }
      </mat-select>

    </mat-form-field>
  </div>
  <div class="d-flex align-items-center">
    <span class="me-2">Type:</span>

    <mat-form-field appearance="outline">
      <mat-label>Type</mat-label>

      <mat-select>
        @for (type of types; track type.value) {
        <mat-option [value]="type.value">
          {{ type.viewValue }}
        </mat-option>
        }
      </mat-select>

    </mat-form-field>
    <div>
      <button class="btn btn-success" (click)="onAddPurchase()">Add Purchase</button>
    </div>

  </div>
